# Disposable services owned by scripts/test-services.mjs; never shares development volumes.
services:
    postgres:
        image: postgres:18
        ports: ['127.0.0.1::5432']
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: template_test
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d template_test']
            interval: 1s
            timeout: 5s
            retries: 60
        tmpfs:
            - /var/lib/postgresql
    redis:
        image: redis:8.10.2-alpine
        ports: ['127.0.0.1::6379']
        command:
            ['redis-server', '--maxmemory-policy', 'noeviction', '--save', '', '--appendonly', 'no']
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 1s
            timeout: 5s
            retries: 30
